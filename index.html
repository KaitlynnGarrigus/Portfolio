<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaitlynn Garrigus | Biology and Mechanical Engineering portfolio</title>
<meta name="description" content="Portfolio of Kaitlynn Garrigus: biology and mechanical engineering coursework, work experience, projects, and photos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body class="home">
<header class="hero"><div class="w">
  <h1 id="name"></h1>
  <p id="tag" style="font:600 1.5rem var(--h);color:#fff"></p>
  <p id="intro"></p>
  <div class="links" id="links"></div>
</div></header>

<div class="w">
  <div class="paths">
    <a class="path" href="biology.html" style="--c:var(--bio);--ct:var(--biot)"><h2>Biology</h2><p id="bb"></p><b>Explore biology</b></a>
    <a class="path" href="engineering.html" style="--c:var(--eng);--ct:var(--engt)"><h2>Mechanical Engineering</h2><p id="eb"></p><b>Explore engineering</b></a>
  </div>

  <section class="sec" id="posts">
    <h2>Posts</h2>
    <p style="color:var(--muted)">Recent updates and projects.</p>
    <div class="chips" id="chips" role="group" aria-label="Filter posts"></div>
    <p class="note" id="note" hidden></p>
    <div id="feed" aria-live="polite"></div>
  </div>
</div>

<script type="module">
import {$,el,fmt,site,list,configured,chrome,lightbox,paras} from './lib.js';
chrome('Home');const open=lightbox();
document.title=site.name+' | '+site.tagline+' portfolio';
$('#name').textContent=site.name;$('#tag').textContent=site.tagline;$('#intro').textContent=site.intro;
$('#bb').textContent=site.biology.blurb;$('#eb').textContent=site.engineering.blurb;
[[site.resume,'Resume'],[site.linkedin,'LinkedIn'],[site.email&&'mailto:'+site.email,'Email me']].forEach(([h,t])=>{if(h){const a=el('a','btn on',t);a.href=h;if(/^https/.test(h)){a.target='_blank';a.rel='noopener'}$('#links').append(a)}});

let posts=[],f='';
const label={biology:'Biology',engineering:'Mechanical Engineering'};
if(!configured){$('#note').textContent='Posts will appear here once the database is connected.';$('#note').hidden=false}
else{try{posts=await list('posts','date','desc')}catch(e){$('#note').textContent='Posts could not be loaded right now.';$('#note').hidden=false}}
function render(){
  const feed=$('#feed');feed.innerHTML='';const l=posts.filter(p=>!f||p.track===f);
  if(!l.length)feed.append(el('p','empty','No posts yet.'));
  l.forEach(p=>{const c=el('article','post'),h=el('div');h.append(el('span','badge '+p.track,label[p.track]||''),el('span','d',fmt(p.date)));c.append(h,el('h3','',p.title));paras(p.body,c);
    if(p.photos?.length){const g=el('div','ph');p.photos.forEach(ph=>{const b=el('button'),i=el('img');b.type='button';i.src=ph.s;i.alt=ph.c||p.title;i.loading='lazy';b.append(i);if(ph.c)b.append(el('span','',ph.c));
      b.onclick=()=>open(ph.s,i.alt,ph.c||p.title,{text:'See more in the '+(label[p.track]||'')+' gallery',href:p.track+'.html#gallery'});g.append(b)});c.append(g)}
    feed.append(c)})}
const ch=$('#chips');[['','All'],['biology','Biology'],['engineering','Engineering']].forEach(([k,t])=>{const b=el('button','chip',t);b.type='button';b.setAttribute('aria-pressed',k===f);b.onclick=()=>{f=k;ch.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};ch.append(b)});
render();
</script>
</body>
</html>
